<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reel Words</title>
  <meta name="description" content="Save the words, phrases and lines you hear in English movies and shows — then review them with spaced repetition.">
  <meta name="theme-color" content="#c2410c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reel Words">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the theme before styles load to avoid a flash
    try {
      var t = (JSON.parse(localStorage.getItem('reel-words:settings')) || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/library">
        <img src="icon.svg" alt="" width="32" height="32">
        <span><strong>Reel Words</strong><small id="brand-sub">Movie English notebook</small></span>
      </a>
      <button class="btn primary block" data-action="new">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="side-new">New entry</span> <kbd>N</kbd>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <button class="fab" data-action="new" aria-label="New entry">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
